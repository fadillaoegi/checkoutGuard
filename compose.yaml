name: checkoutguard
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: checkoutguard
      POSTGRES_USER: checkoutguard
      POSTGRES_PASSWORD: checkoutguard_local
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - checkoutguard_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkoutguard -d checkoutguard"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  checkoutguard_pg:
